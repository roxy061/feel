    <!-- Logic Script (Vanilla JS Port of WorksWheel) -->
    <script>
        // Data Collections
        const PORTFOLIO_WORKS = [

                image: "./project_vending/IMG_20260218_114431.jpg",

            },

            },
            {

            },
            {

            },
            {

            },
            {

                image: "./ตัวเองตอน ฝึกดร..JPG",
                href: "./index.html#experience",
                action: "ดูประวัติฝึกงาน"
            }
        ];

        const DEMO_WORKS = [
            {
                title: "Prismatic Rift",
                image: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80",
                href: "#prismatic-rift",
                action: "View Art"
            },
            {
                title: "Ember Clouds",
                image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80",
                href: "#ember-clouds",
                action: "View Art"
            },
            {
                title: "Neon Portal",
                image: "https://images.unsplash.com/photo-1508739773434-c26b3d09e071?auto=format&fit=crop&w=800&q=80",
                href: "#neon-portal",
                action: "View Art"
            },
            {
                title: "Red Ribbon",
                image: "https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&w=800&q=80",
                href: "#red-ribbon",
                action: "View Art"
            },
            {
                title: "Celestial",
                image: "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?auto=format&fit=crop&w=800&q=80",
                href: "#celestial",
                action: "View Art"
            },
            {
                title: "Uplight",
                image: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=800&q=80",
                href: "#uplight",
                action: "View Art"
            },
            {
                title: "Indigo Marble",
                image: "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=800&q=80",
                href: "#indigo-marble",
                action: "View Art"
            },
            {
                title: "Launch Window",
                image: "https://images.unsplash.com/photo-1517976487515-59a9e69d7675?auto=format&fit=crop&w=800&q=80",
                href: "#launch-window",
                action: "View Art"
            },
            {
                title: "Cosmic Wave",
                image: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=800&q=80",
                href: "#cosmic-wave",
                action: "View Art"
            }
        ];

        // Active dataset
        let currentItems = PORTFOLIO_WORKS;
        let currentLabel = "ผลงาน '26";

        // Geometry Constants
        const CARD_H = 0.38;
        const CARD_MAX_W = 0.34;
        const CARD_RATIO = 1.45;
        const STEP = 40;
        const DRUM = 2.22;
        const LENS = 2.7;
        const RING_R = 1.14;
        const BOW = 1.82;
        const TITLE = 0.124;
        const INDEX = 0.04;
        const CULL = 1.6;

        const WHEEL_UNITS = 900;
        const DRAG_UNITS = 420;
        const SETTLE = 140;
        const EASE = 0.12;

        const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
        const lerp = (a, b, t) => a + (b - a) * t;
        const rad = (deg) => (deg * Math.PI) / 180;
        const bowAt = (drumDeg, bow) => -bow * (1 - Math.cos(rad(drumDeg)));

        function place(ringDeg, drumDeg, ringR, drumR, bow, m) {
            return `translateX(${m * bowAt(drumDeg, bow)}px) rotateZ(${(1 - m) * ringDeg}deg) translateY(${-(1 - m) * ringR}px) rotateX(${m * drumDeg}deg) translateZ(${m * drumR}px)`;
        }

        // State
        let stageW = 0;
        let stageH = 0;
        let turn = 0;
        let target = 0;
        let active = 0;
        let settlingTimer = null;
        let dragY = null;
        let cardElements = [];
        let indexButtons = [];
        let reducedMotion = false;

        // Elements
        const stageEl = document.getElementById('stage');
        const wheelContainerEl = document.getElementById('wheel-container');
        const ringLabelEl = document.getElementById('ring-label');
        const frontTitleEl = document.getElementById('front-title');
        const indexListEl = document.getElementById('index-list');

        function checkReducedMotion() {
            reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        }

        function calculateMetrics() {
            const w = stageW;
            const h = stageH;
            const cardW = Math.min(h * CARD_H * CARD_RATIO, w * CARD_MAX_W);
            const cardH = cardW / CARD_RATIO;
            const drumR = cardH * DRUM;
            const ringR = cardH * RING_R;
            const count = currentItems.length;
            const ringScale = count ? clamp((((2 * Math.PI * ringR) / count) * 0.82) / (cardW || 1), 0.16, 1) : 1;
            return {
                cardW,
                cardH,
                ringR,
                ringScale,
                drumR,
                bow: cardH * BOW,
                depth: cardH * LENS,
                titleSize: cardH * TITLE,
                indexSize: Math.max(12, cardH * INDEX)
            };
        }

        function to(next) {
            const last = Math.max(currentItems.length - 1, 0);
            target = clamp(next, 0, last + 1);
        }

        function renderWheelItems() {
            wheelContainerEl.innerHTML = '';
            indexListEl.innerHTML = '';
            cardElements = [];
            indexButtons = [];

            const metrics = calculateMetrics();
            const count = currentItems.length;

            currentItems.forEach((item, i) => {
                // 1. Create Card
                const card = document.createElement('div');
                card.id = `card-${i}`;
                card.role = 'option';
                card.className = 'group absolute [backface-visibility:hidden] cursor-pointer transition-shadow';
                card.style.width = `${metrics.cardW}px`;
                card.style.height = `${metrics.cardH}px`;
                card.style.marginLeft = `${-metrics.cardW / 2}px`;
                card.style.marginTop = `${-metrics.cardH / 2}px`;

                card.innerHTML = `
                    <div class="card-face relative w-full h-full rounded-2xl overflow-hidden bg-slate-900 shadow-2xl border border-white/20">
                        <img 
                            src="${item.image}" 
                            alt="${item.title}" 
                            draggable="false" 
                            class="w-full h-full object-cover select-none pointer-events-none group-hover:scale-105 transition-transform duration-300"
                        />
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
                        <div class="absolute bottom-3 left-3 right-3 flex items-center justify-between text-white">
                            <span class="text-xs font-bold font-heading drop-shadow truncate pr-2">${item.title}</span>
                            <span class="px-2.5 py-1 rounded-full bg-white/20 backdrop-blur-md text-[10px] font-semibold flex items-center gap-1 group-hover:bg-google-blue group-hover:text-white transition-colors">
                                <span>${item.action || 'เปิดดู'}</span>
                                <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                            </span>
                        </div>
                    </div>
                `;

                card.onclick = (e) => {
                    // If card is front card, navigate or show modal
                    if (active === i && turn > 0.5) {
                        if (item.href.startsWith('#')) {
                            openPreviewModal(item.title, item.image, item.href);
                        } else {
                            window.location.href = item.href;
                        }
                    } else {
                        to(i + 1);
                    }
                };

                wheelContainerEl.appendChild(card);
                cardElements.push(card);

                // 2. Create Index List item
                const li = document.createElement('li');
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'cursor-pointer hover:text-google-blue dark:hover:text-white transition-colors font-heading text-right truncate max-w-[220px] sm:max-w-xs block py-0.5';
                btn.style.fontSize = `${metrics.indexSize}px`;
                btn.textContent = `${i + 1}. ${item.title}`;
                btn.onclick = () => to(i + 1);

                li.appendChild(btn);
                indexListEl.appendChild(li);
                indexButtons.push(btn);
            });

            ringLabelEl.textContent = currentLabel;
            ringLabelEl.style.fontSize = `${metrics.titleSize}px`;
            frontTitleEl.style.fontSize = `${metrics.titleSize}px`;
            stageEl.style.perspective = `${metrics.depth}px`;
        }

        // Animation Loop via requestAnimationFrame
        function animate() {
            requestAnimationFrame(animate);

            if (!stageH) return;

            const gap = target - turn;
            if (Math.abs(gap) < 0.0005) {
                turn = target;
            } else {
                turn += gap * (reducedMotion ? 1 : EASE);
            }

            const t = turn;
            const m = clamp(t, 0, 1);
            const pos = Math.max(0, t - 1);
            const count = currentItems.length;
            const last = Math.max(count - 1, 0);
            const metrics = calculateMetrics();

            // Transform wheel container
            wheelContainerEl.style.transform = `translateZ(${-m * metrics.drumR}px)`;

            for (let i = 0; i < count; i++) {
                const d = i - pos;
                const drumDeg = d * STEP;
                const card = cardElements[i];

                if (card) {
                    card.style.transform = place(
                        d * (360 / count),
                        drumDeg,
                        metrics.ringR,
                        metrics.drumR,
                        metrics.bow,
                        m
                    );

                    card.style.opacity = (m > 0.5 && Math.abs(d) > CULL) ? "0" : "1";
                    card.style.zIndex = String(Math.round(100 - Math.abs(d) * 2));

                    const face = card.querySelector('.card-face');
                    if (face) {
                        face.style.transform = `scale(${lerp(metrics.ringScale, 1, m)})`;
                    }
                }
            }

            ringLabelEl.style.opacity = String(1 - m);
            frontTitleEl.style.opacity = String(m);

            const near = clamp(Math.round(pos), 0, last);
            if (active !== near) {
                active = near;
                frontTitleEl.textContent = currentItems[active]?.title || '';

                indexButtons.forEach((btn, idx) => {
                    if (idx === active) {
                        btn.classList.add('text-google-blue', 'dark:text-white', 'font-bold');
                        btn.classList.remove('text-muted-foreground');
                    } else {
                        btn.classList.remove('text-google-blue', 'dark:text-white', 'font-bold');
                        btn.classList.add('text-muted-foreground');
                    }
                });
            }
        }

        // Resize Observer
        function setupResize() {
            const updateSize = () => {
                stageW = stageEl.clientWidth;
                stageH = stageEl.clientHeight;
                const metrics = calculateMetrics();
                ringLabelEl.style.fontSize = `${metrics.titleSize}px`;
                frontTitleEl.style.fontSize = `${metrics.titleSize}px`;
                stageEl.style.perspective = `${metrics.depth}px`;

                cardElements.forEach(card => {
                    card.style.width = `${metrics.cardW}px`;
                    card.style.height = `${metrics.cardH}px`;
                    card.style.marginLeft = `${-metrics.cardW / 2}px`;
                    card.style.marginTop = `${-metrics.cardH / 2}px`;
                });

                indexButtons.forEach(btn => {
                    btn.style.fontSize = `${metrics.indexSize}px`;
                });
            };

            const ro = new ResizeObserver(updateSize);
            ro.observe(stageEl);
            updateSize();
        }

        // Gesture and Event Handlers
        function setupEventListeners() {
            // Wheel gesture
            stageEl.addEventListener('wheel', (e) => {
                const next = target + e.deltaY / WHEEL_UNITS;
                const last = Math.max(currentItems.length - 1, 0);
                if (next > 0 && next < last + 1) e.preventDefault();
                to(next);

                clearTimeout(settlingTimer);
                settlingTimer = setTimeout(() => {
                    to(Math.round(target));
                }, SETTLE);
            }, { passive: false });

            // Pointer drag
            stageEl.addEventListener('pointerdown', (e) => {
                dragY = e.clientY;
                stageEl.setPointerCapture(e.pointerId);
            });

            stageEl.addEventListener('pointermove', (e) => {
                if (dragY === null) return;
                to(target + (dragY - e.clientY) / DRAG_UNITS);
                dragY = e.clientY;
            });

            stageEl.addEventListener('pointerup', () => {
                dragY = null;
                if (target > 1) to(Math.round(target));
            });

            // Keyboard navigation
            stageEl.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowDown') {
                    to(Math.round(target) + 1);
                    e.preventDefault();
                } else if (e.key === 'ArrowUp') {
                    to(Math.round(target) - 1);
                    e.preventDefault();
                }
            });
        }

        // Switch between Portfolio Works and Demo Art
        function switchDataMode(mode) {
            const btnPort = document.getElementById('btn-mode-portfolio');
            const btnDemo = document.getElementById('btn-mode-demo');

            if (mode === 'portfolio') {
                currentItems = PORTFOLIO_WORKS;
                currentLabel = "ผลงาน '26";
                btnPort.className = "px-3 py-1 rounded-full font-bold bg-white dark:bg-google-dark-surface shadow-xs text-google-blue transition-all";
                btnDemo.className = "px-3 py-1 rounded-full font-medium text-muted-foreground hover:text-foreground transition-all";
            } else {
                currentItems = DEMO_WORKS;
                currentLabel = "Works '26";
                btnDemo.className = "px-3 py-1 rounded-full font-bold bg-white dark:bg-google-dark-surface shadow-xs text-google-blue transition-all";
                btnPort.className = "px-3 py-1 rounded-full font-medium text-muted-foreground hover:text-foreground transition-all";
            }

            target = 0;
            turn = 0;
            active = 0;
            renderWheelItems();
        }

        // Modal Helpers
        function openPreviewModal(title, imgUrl, linkUrl) {
            const modal = document.getElementById('preview-modal');
            const mTitle = document.getElementById('modal-title');
            const mImg = document.getElementById('modal-img');
            const mLink = document.getElementById('modal-link');

            mTitle.textContent = title;
            mImg.src = imgUrl;
            mLink.href = linkUrl;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closePreviewModal() {
            const modal = document.getElementById('preview-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // Theme Toggle
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            const icon = document.getElementById('theme-icon');
            if (icon) {
                icon.className = isDark ? 'fa-solid fa-sun text-xs text-yellow-400' : 'fa-solid fa-moon text-xs';
            }
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                const icon = document.getElementById('theme-icon');
                if (icon) icon.className = 'fa-solid fa-sun text-xs text-yellow-400';
            }

            checkReducedMotion();
            renderWheelItems();
            setupResize();
            setupEventListeners();
            animate();
        });
    </script>

    <script src="js/swarm-rebuild.js"></script>
